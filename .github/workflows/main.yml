name: Build Windows EXE + Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  # ═══════════════════════════════════════
  # JOB 1: Build Windows EXE
  # ═══════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Build Windows EXE
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-electron/*.exe
          retention-days: 30

  # ═══════════════════════════════════════
  # JOB 2: Build Android APK
  # ═══════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android
        continue-on-error: true

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Generate a release keystore if one doesn't exist
      - name: Generate Release Keystore
        run: |
          cd android/app
          if [ ! -f release.keystore ]; then
            keytool -genkey -v               -keystore release.keystore               -alias termuxlearn               -keyalg RSA               -keysize 2048               -validity 10000               -storepass ${{ secrets.KEYSTORE_PASSWORD || 'termuxlearn123' }}               -keypass ${{ secrets.KEYSTORE_PASSWORD || 'termuxlearn123' }}               -dname "CN=Iminthisera, OU=Dev, O=Iminthisera, L=City, ST=State, C=BD"
          fi

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android APK (Signed Release)
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'termuxlearn123' }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'termuxlearn123' }}

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ═══════════════════════════════════════
  # JOB 3: Create Release
  # ═══════════════════════════════════════
  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./artifacts/windows/

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Termux Coding Learn v${{ github.run_number }}

            ### Downloads
            - **Windows EXE**: `Termux Coding Learn Setup.exe`
            - **Android Debug APK**: `app-debug.apk` (for testing)
            - **Android Signed Release APK**: `app-release-unsigned.apk` (installable)

            ### Features
            - 400+ typing lessons across 40 levels
            - Offline-first learning
            - Shadow text typing engine
            - Terminal simulator
            - Code playground

            Built with ❤️ by Iminthisera Team
          files: |
            artifacts/windows/*.exe
            artifacts/android/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
