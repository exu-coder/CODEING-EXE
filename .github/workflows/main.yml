name: Build Windows EXE + Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Build Windows EXE
        run: npx electron-builder --win --publish never

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-electron -Filter *.exe -File
          if (-not $exe) {
            Write-Error "No Windows EXE was produced."
            exit 1
          }
          $exe | Select-Object FullName, Length

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create EXE Release
    needs: build-windows
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts

      - name: Verify downloaded EXE
        shell: bash
        run: |
          set -e
          ls -lh artifacts/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Termux Coding Learn v${{ github.run_number }}
          generate_release_notes: true
          body: |
            ## Termux Coding Learn v${{ github.run_number }}

            Windows EXE release.

            Includes the latest 60-level coding game build.
          files: artifacts/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
