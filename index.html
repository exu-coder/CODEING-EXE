<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="TermuxLearn — Learn Termux commands and coding skills offline. Type. Practice. Execute." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/src/assets/icons/logo.png" />
  <link rel="apple-touch-icon" href="/src/assets/icons/logo.png" />
  <title>TermuxLearn</title>
  <style>
    body { background: #000; margin: 0; }
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #000; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .loader-logo {
      width: 96px; height: 96px; border-radius: 22%;
      object-fit: cover;
      box-shadow: 0 0 32px rgba(32, 194, 14, 0.35);
      animation: loaderPulse 1.6s ease-in-out infinite;
    }
    @keyframes loaderPulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .loader-text {
      color: #20c20e; font-family: 'Orbitron', sans-serif;
      font-size: 13px; margin-top: 18px; letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <img class="loader-logo" src="/src/assets/icons/logo.png" alt="TermuxLearn" />
    <div class="loader-text">TERMUXLEARN</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Hide boot loader once React mounts
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var el = document.getElementById('loading-screen')
        if (el) el.style.display = 'none'
      }, 400)
    })
  </script>
</body>
</html>
